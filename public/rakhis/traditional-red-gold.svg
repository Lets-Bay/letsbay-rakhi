<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="center1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </radialGradient>
    <radialGradient id="gem1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4444"/>
      <stop offset="100%" stop-color="#CC0000"/>
    </radialGradient>
  </defs>
  <!-- Thread -->
  <path d="M 0 100 Q 40 95 70 100" stroke="#CC0000" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 130 100 Q 160 105 200 100" stroke="#CC0000" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="40" fill="url(#center1)" stroke="#B8860B" stroke-width="2"/>
  <!-- Decorative petals -->
  <g transform="translate(100,100)">
    <ellipse cx="0" cy="-28" rx="8" ry="14" fill="#CC0000" opacity="0.9"/>
    <ellipse cx="28" cy="0" rx="14" ry="8" fill="#CC0000" opacity="0.9"/>
    <ellipse cx="0" cy="28" rx="8" ry="14" fill="#CC0000" opacity="0.9"/>
    <ellipse cx="-28" cy="0" rx="14" ry="8" fill="#CC0000" opacity="0.9"/>
    <ellipse cx="20" cy="-20" rx="8" ry="12" fill="#CC0000" opacity="0.7" transform="rotate(45)"/>
    <ellipse cx="20" cy="20" rx="12" ry="8" fill="#CC0000" opacity="0.7" transform="rotate(45)"/>
    <ellipse cx="-20" cy="20" rx="8" ry="12" fill="#CC0000" opacity="0.7" transform="rotate(45)"/>
    <ellipse cx="-20" cy="-20" rx="12" ry="8" fill="#CC0000" opacity="0.7" transform="rotate(45)"/>
  </g>
  <!-- Center gem -->
  <circle cx="100" cy="100" r="12" fill="url(#gem1)" stroke="#FFD700" stroke-width="3"/>
  <!-- Gold dots -->
  <circle cx="100" cy="70" r="3" fill="#FFD700"/>
  <circle cx="100" cy="130" r="3" fill="#FFD700"/>
  <circle cx="70" cy="100" r="3" fill="#FFD700"/>
  <circle cx="130" cy="100" r="3" fill="#FFD700"/>
</svg>
